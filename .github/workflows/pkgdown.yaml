on:
  # Must match build-site.yaml's `name:` exactly. It read "Render, deploy site"
  # until 2026-08-23, naming a workflow that has never existed, so this trigger
  # had never once fired and the cron below was the only thing running this
  # workflow. That is why disabling the cron for inactivity stopped the package
  # sites being built at all.
  workflow_run:
    workflows: ["Render and deploy site"]
    types:
      - completed
  schedule:
    # run every day at 11 PM
    - cron: '0 23 * * *'
  # So a rebuild can be asked for without waiting for the cron.
  workflow_dispatch:

name: Build Pkgdown

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.package }} ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'release', package: 'declaredesign', branch: 'main'}
          - {os: macOS-latest, r: 'release', package: 'fabricatr', branch: 'main'}
          - {os: macOS-latest, r: 'release', package: 'randomizr', branch: 'main'}
          - {os: macOS-latest, r: 'release', package: 'estimatr', branch: 'main'}
          - {os: macOS-latest, r: 'release', package: 'rdss', branch: 'main'}
          - {os: macOS-latest, r: 'release', package: 'designlibrary', branch: 'master'}
          
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ABORT_ON_MISSING_TOPICS: FALSE

    steps:

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" sends macOS to Posit Package Manager as well as Linux.
          # CRAN began serving part of its macOS R 4.6 binaries as zstd archives
          # under the .tgz name on 2026-09-17, and the pak that
          # setup-r-dependencies installs cannot extract them, so every job here
          # died at the estimatr 2.0.0 install (r-lib/pkgdepends#485). Posit
          # Package Manager still serves gzip builds of the same versions.
          # Drop this line once a released pak reads zstd.
          use-public-rspm: always

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
        
      - name: Clone all DD packages
        run: | 
          git clone -b ${{ matrix.config.branch }} https://github.com/DeclareDesign/${{ matrix.config.package }} pkg

      - name: Search for dependences in docs
        run: Rscript -e 'library(checkpoint); found_packages <- scan_project_files(".", scan_rnw_with_knitr = TRUE)$pkgs; if(length(found_packages[!found_packages%in% installed.packages()[, 1]]) > 0) install.packages(found_packages[!found_packages%in% installed.packages()[,1]], repos = "https://cran.r-project.org")'

      # The site documents the cloned branch, so install that branch rather than
      # building against the CRAN version the dependency step pulled in. Until
      # estimatr 2.0 (2026-09-15) the two matched, and the gap never showed.
      - name: Install the package being documented
        run: |
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes", repos = "https://cran.r-project.org")
          remotes::install_local("pkg", dependencies = TRUE, force = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site(pkg = "pkg")
        shell: Rscript {0}

      - name: Push to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: 'pkg/docs'
          target-folder: 'r/${{ matrix.config.package }}'
          clean: true
          