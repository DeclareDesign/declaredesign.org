on:
  push:
    branches: main
  pull_request:
    branches: main

name: Render and deploy site

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # - name: Install pandoc
      #   uses: r-lib/actions/setup-pandoc@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          
      # Rendering and deploying are separate steps because `quarto publish
      # gh-pages` replaces the whole branch, and the branch is not only this
      # site: pkgdown.yaml writes each package's documentation to r/<package>
      # there. Publishing therefore deleted all six package sites and left only
      # the ones that happened to rebuild afterwards, which on 2026-08-23 took
      # r/declaredesign and r/designlibrary off the site until they were
      # restored by hand. clean-exclude keeps r/ out of the deploy's reach.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: _site
          clean: true
          clean-exclude: |
            r/**
